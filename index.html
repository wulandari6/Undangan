
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171313">
    <title>Undangan Pernikahan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #171313;
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
            background: #171313;
        }

        /* Kunci halaman sebelum undangan dibuka */
        body.belum-dibuka {
            height: 100vh;
            height: 100svh;
            overflow: hidden;
        }

        body.sudah-dibuka {
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Satu video untuk satu layar */
        .halaman {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171313;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        /* Menjaga desain Canva tetap utuh */
        .video-undangan {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background: #171313;
        }

        /* Sampul video pertama */
        .sampul {
            position: relative;
        }

        .cover-isi {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            width: min(88%, 360px);
            padding: 20px 16px;
            text-align: center;
            background: rgba(25, 19, 19, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        .cover-isi p {
            font-size: clamp(13px, 3.5vw, 16px);
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .cover-isi h1 {
            font-family: Georgia, serif;
            font-size: clamp(22px, 6vw, 32px);
            line-height: 1.3;
            overflow-wrap: anywhere;
            margin-bottom: 18px;
        }

        .tombol-buka {
            display: inline-block;
            padding: 12px 23px;
            max-width: 100%;
            border: none;
            border-radius: 30px;
            background: #f5dce3;
            color: #38232a;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .tombol-buka:active {
            transform: scale(0.97);
        }

        /* Navigasi di bagian bawah */
        .navigasi {
            position: fixed;
            z-index: 10;
            left: 50%;
            bottom: max(10px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            width: max-content;
            max-width: calc(100% - 12px);
            overflow-x: auto;
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            background: rgba(25, 20, 20, 0.88);
            backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch;
        }

        .navigasi a {
            flex: 0 0 auto;
            padding: 9px 10px;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 11px;
            white-space: nowrap;
        }

        .navigasi a:active {
            background: rgba(255, 255, 255, 0.2);
        }

        body.belum-dibuka .navigasi {
            display: none;
        }

        /* Penyesuaian untuk HP */
        @media (max-width: 480px) {
            .cover-isi {
                top: 10%;
                width: 86%;
                padding: 17px 13px;
            }

            .cover-isi h1 {
                margin-bottom: 14px;
            }

            .navigasi a {
                padding: 9px 8px;
                font-size: 10px;
            }
        }

        /* HP dengan layar pendek */
        @media (max-height: 600px) {
            .cover-isi {
                top: 4%;
                padding: 10px;
            }

            .cover-isi p {
                margin-bottom: 4px;
            }

            .cover-isi h1 {
                margin-bottom: 9px;
            }

            .tombol-buka {
                padding: 9px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
    </style>
</head>

<body class="belum-dibuka">

    <!-- VIDEO 1: SAMPUL -->
    <section class="halaman sampul" id="sampul">
        <video class="video-undangan"
               src="1.mp4"
               autoplay muted loop playsinline
               preload="auto"></video>

        <div class="cover-isi">
            <p>Kepada Yth.</p>
            <p>Bapak/Ibu/Saudara/i</p>
            <h1 id="namaTamu">Tamu Undangan</h1>

            <button class="tombol-buka" id="tombolBuka">
                Buka Undangan
            </button>
        </div>
    </section>

    <!-- VIDEO 2 -->
    <section class="halaman" id="pembukaan">
        <video class="video-undangan"
               src="2.mp4" muted loop playsinline
               preload="metadata"></video>
    </section>

    <!-- VIDEO 3 -->
    <section class="halaman" id="pengantin">
        <video class="video-undangan"
               src="3.mp4" muted loop playsinline
               preload="metadata"></video>
    </section>

    <!-- VIDEO 4 -->
    <section class="halaman" id="acara">
        <video class="video-undangan"
               src="4.mp4" muted loop playsinline
               preload="metadata"></video>
    </section>

    <!-- VIDEO 5 -->
    <section class="halaman" id="lokasi">
        <video class="video-undangan"
               src="5.mp4" muted loop playsinline
               preload="metadata"></video>
    </section>

    <!-- VIDEO 7: PENUTUP -->
    <section class="halaman" id="penutup">
        <video class="video-undangan"
               src="7.mp4" muted loop playsinline
               preload="metadata"></video>
    </section>

    <!-- NAVIGASI TANPA HADIAH -->
    <nav class="navigasi" aria-label="Navigasi undangan">
        <a href="#sampul">Sampul</a>
        <a href="#pembukaan">Pembukaan</a>
        <a href="#pengantin">Pengantin</a>
        <a href="#acara">Acara</a>
        <a href="#rsvp">Lokasi</a>
        <a href="#penutup">Penutup</a>
    </nav>

    <script>
        // Membaca nama tamu dari alamat URL
        const parameter = new URLSearchParams(
            window.location.search
        );

        const nama = parameter.get("to");

        if (nama && nama.trim() !== "") {
            document.getElementById("namaTamu").textContent =
                nama.replace(/\+/g, " ");
        }

        const tombolBuka = document.getElementById("tombolBuka");
        const semuaVideo = document.querySelectorAll(".video-undangan");
        const semuaHalaman = document.querySelectorAll(".halaman");

        // Memutar video yang sedang terlihat
        const pengamat = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                const video = entry.target.querySelector("video");

                if (!video) return;

                if (entry.isIntersecting) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
            });
        }, {
            threshold: 0.5
        });

        semuaHalaman.forEach((halaman) => {
            pengamat.observe(halaman);
        });

        // Tombol membuka undangan
        tombolBuka.addEventListener("click", () => {
            document.body.classList.remove("belum-dibuka");
            document.body.classList.add("sudah-dibuka");

            document.getElementById("pembukaan").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        });

        // Menjalankan video sampul
        semuaVideo[0].play().catch(() => {});
    </script>

</body>
</html>
